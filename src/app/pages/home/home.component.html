<div class="hero">
  <h1>🚙 Owner-Type Jeep Wiring Guide</h1>
  <p>12V system reference — tap any accessory to see its wiring diagram, wire gauge and fuse rating.</p>
  <a class="hero-link" routerLink="/reference">View main architecture, fuse panel &amp; ground plan →</a>
</div>

<div class="category" *ngFor="let cat of categories">
  <h2><span class="icon">{{ cat.icon }}</span> {{ cat.name }}</h2>
  <div class="grid">
    <a
      class="card"
      *ngFor="let c of circuitsFor(cat.id)"
      [routerLink]="['/accessory', c.id]"
    >
      <div class="card-name">{{ c.name }}</div>
      <div class="card-meta">
        <span>{{ c.wireGauge }}</span>
        <span class="fuse">{{ c.fuse }}</span>
      </div>
    </a>
  </div>
</div>
